name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record host and toolchain
        run: |
          sw_vers
          uname -m
          swift --version
          xcodebuild -version
      - name: Build
        run: swift build
      - name: Swift tests (owned stores; separate download processes)
        run: python3 Tests/run-ci-tests.py
      - name: History regression
        run: Tests/HistoryRegression/run.sh
      - name: Extension file rules
        run: Tests/run-extension-files-tests.sh
      - name: Assemble development bundle (no release credentials)
        run: ./build.sh debug
